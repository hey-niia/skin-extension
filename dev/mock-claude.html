<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mock Claude</title>
<style>
  body{margin:0;font:14px -apple-system,Helvetica,sans-serif;background:#f5f4ef;color:#222;display:flex;height:100vh}
  nav{width:260px;border-right:1px solid #ddd;padding:12px;overflow:auto;flex:none}
  nav a{display:block;padding:6px 8px;color:#333;text-decoration:none;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav a:hover{background:#eae8e0}
  .page{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
  #thread{color:#333;width:min(640px,100%);overflow:auto;max-height:60vh;display:flex;flex-direction:column;gap:12px}
  [data-testid="user-message"]{align-self:flex-end;background:#e8e4da;padding:8px 12px;border-radius:12px;white-space:pre-wrap}
  .font-claude-response{line-height:1.5}
  .box{width:min(640px,100%);background:#fff;border:1px solid #ddd;border-radius:16px;padding:12px;display:flex;gap:8px;align-items:flex-end}
  .ProseMirror{flex:1;min-height:24px;outline:none;white-space:pre-wrap}
  #files{font-size:12px;color:#777}
  button[aria-label]{width:32px;height:32px;border-radius:8px;border:0;background:#c96442;color:#fff}
  button[aria-label]:disabled{opacity:.4}
</style>
</head>
<body>
<nav id="side"><a href="/new" id="newchat"><b>+ New chat</b></a><b>Recents</b></nav>
<div class="page">
  <div id="thread">Mock of a chat site — for testing the Skin content script.</div>
  <div id="files"></div>
  <div class="box">
    <input type="file" multiple id="mf" hidden>
    <div class="ProseMirror" contenteditable="true"></div>
    <button aria-label="Send message" disabled>↑</button>
  </div>
</div>
<script>
  // Neutral sample titles, English + Ukrainian, like a real sidebar
  const titles = [
    "Visa document checklist", "Питання про посвідку на проживання", "Embassy appointment prep",
    "Sleep routine ideas", "Питання до лікаря",
    "Invoice template", "Податки для ФОП 3 групи", "Monthly budget",
    "Cover letter draft", "Portfolio case study structure", "Підготовка до співбесіди",
    "Logo color exploration", "Figma auto layout question",
    "Python script to rename files", "React state bug", "CSS grain texture",
    "Explain English grammar: articles", "Переклад листа",
    "Weekend trip itinerary", "Packing list",
    "Soup recipe", "Brainstorm app names", "Random question about cats",
    "Auto layout variants in components", "Grid for paper cards", "Cats and dogs behaviour",
    "Wedding speech draft", "Plant care for monstera", "Monstera leaves turning yellow",
    "Paper texture shader", "Component naming conventions", "Weekend in Lviv"
  ];
  const side = document.getElementById("side"), thread = document.getElementById("thread");
  const convos = {};
  // like the real page: a screen-reader heading, a thinking summary (shown twice),
  // a tool step, then the answer inside .standard-markdown
  const answer = (t) => `<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Claude responded: Here's a short take on ${t}.</h2>
    <div class="thinking"><button><span>Weighing a few directions for ${t}</span></button><div class="summary">Weighing a few directions for ${t}</div><div style="display:none">long hidden reasoning…</div></div>
    <div class="tool">Searched the web · 4 results</div>
    <div class="standard-markdown"><p>Here's a short take on <strong>${t}</strong>.</p><ul><li>First, the main idea.</li><li>Then a detail with <code>inline code</code>.</li></ul><pre><code>const paper = "grain";</code></pre><p>More: <a href="https://example.com">a link</a>. <button>Copy</button> <span onclick="window.__evil=1" style="color:red">styled span</span></p><img alt="chart"></div>`;
  const show = (id) => {
    thread.innerHTML = "";
    for (const m of convos[id] || []) {
      const d = document.createElement("div");
      if (m.user) { d.dataset.testid = "user-message"; d.textContent = m.text; }
      else { d.className = "font-claude-response"; d.innerHTML = m.html; }
      thread.appendChild(d);
    }
  };
  const link = (t, id, top) => {
    const a = document.createElement("a");
    a.href = "/chat/" + id; a.textContent = t;
    convos[id] ||= [{ user: true, text: t + "?" }, { html: answer(t) }];
    a.onclick = (e) => { e.preventDefault(); history.pushState({}, "", a.href); document.title = t + " - Claude"; show(id); };
    top ? side.insertBefore(a, side.children[2]) : side.appendChild(a);
  };
  titles.forEach((t, i) => link(t, (i + 1).toString(16).padStart(8, "0") + "-0000-4000-8000-000000000000"));
  document.getElementById("newchat").onclick = (e) => { e.preventDefault(); history.pushState({}, "", "/new"); thread.innerHTML = ""; };
  // stream a reply word by word, like the real thing
  function reply(id, text) {
    const words = ("Thanks — got it. " + (text.length > 60 ? "That's a long one. " : "") + "Here is a considered answer, written slowly so you can watch it arrive on paper.").split(" ");
    const m = { html: "" }; convos[id].push(m); show(id);
    const el = thread.lastElementChild; el.dataset.isStreaming = "true";
    let i = 0; const t = setInterval(() => {
      if (i >= words.length) { clearInterval(t); el.dataset.isStreaming = "false"; return; }
      m.html = "<p>" + words.slice(0, ++i).join(" ") + "</p>"; el.innerHTML = m.html;
    }, 90);
  }

  // like the real site: start typing anywhere and the site's own editor grabs focus
  document.addEventListener("keydown", (e) => {
    const a = document.activeElement;
    if (e.metaKey || e.ctrlKey || e.altKey || e.key.length !== 1) return;
    if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.isContentEditable)) return;
    document.querySelector(".ProseMirror").focus();
  });
  // …and it takes pasted files for itself
  document.addEventListener("paste", (e) => { if (e.clipboardData?.files?.length) { e.preventDefault(); window.__sitePaste = (window.__sitePaste || 0) + 1; } });

  // composer that behaves roughly like the real one
  const ed = document.querySelector(".ProseMirror"), send = document.querySelector("[aria-label='Send message']"), mf = document.getElementById("mf");
  let files = [];
  const sync = () => { send.disabled = !ed.textContent.trim() && !files.length; document.getElementById("files").textContent = files.length ? files.map((f) => "📎 " + f.name).join("  ") : ""; };
  ed.addEventListener("input", sync);
  mf.addEventListener("change", () => { files = [...files, ...mf.files]; sync(); });
  send.onclick = () => {
    const text = ed.textContent.trim() + (files.length ? "\n📎 " + files.map((f) => f.name).join(", ") : "");
    let id = (location.pathname.match(/^\/chat\/(.+)/) || [])[1];
    if (!id) {
      id = Date.now().toString(16).padStart(8, "0").slice(-8) + "-0000-4000-8000-000000000001";
      convos[id] = []; link(text.slice(0, 40) || "Untitled", id, true);
      history.pushState({}, "", "/chat/" + id);
    }
    convos[id].push({ user: true, text }); show(id);
    ed.textContent = ""; files = []; sync();
    setTimeout(() => reply(id, text), 300);
  };
</script>
<script src="chrome-shim.js"></script>
<script>
  // always load the latest content script while developing
  const cs = document.createElement("script"); cs.src = "../src/content.js?" + Date.now(); document.body.appendChild(cs);
</script>
</body>
</html>
